version: "2"

# Beyond the default tier (errcheck, govet, ineffassign, staticcheck, unused),
# this enables the checks from TigerBeetle's TIGER_STYLE.md that translate
# to Go and that this repo already passes with zero violations, so they
# stand as regression guards, not cleanup work. See the design discussion in
# ~/engineering/issues/2026-08-15-adopt-tigerstyle-static-checks.md.
#
# lll (100-column limit) and wrapcheck (wrap external errors at the
# boundary) also apply, but need a real fix pass first — tracked in that
# issue's Tasks, not enabled here yet.
linters:
  default: standard
  enable:
    - errname
    - funlen
    - godot
    - gocyclo
    - nestif
    - nilnil
    - noctx
    - predeclared
    - unparam
  settings:
    funlen:
      lines: 70
      statements: 60
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 4
  exclusions:
    rules:
      # fakelsp is test scaffolding for internal/lsp, not production code
      # (see docs/ARCHITECTURE.md) — same reasoning that excludes it from
      # the coverage floor.
      - path: internal/lsp/fakelsp/
        linters:
          - gocyclo
