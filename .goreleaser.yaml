version: 2

project_name: waythrough

before:
  hooks:
    - ./scripts/check.sh

builds:
  - id: waythrough
    main: ./cmd/waythrough
    binary: waythrough
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/gustavofsantos/waythrough/internal/cli.version={{ .Version }}

archives:
  - id: waythrough
    formats: [tar.gz]
    # mise installs Waythrough through its github backend, which picks a
    # release asset by matching the operating system and the architecture
    # tokens in the asset name, then takes the binary named after the
    # repository from the archive root. Keep `{{ .Os }}` and `{{ .Arch }}` in
    # this template, or `mise use -g github:gustavofsantos/waythrough` finds
    # no asset to install.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

brews:
  - name: waythrough
    homepage: https://github.com/gustavofsantos/waythrough
    description: MCP server that connects coding agents to LSP servers
    repository:
      owner: gustavofsantos
      name: waythrough
      branch: main
      # Branch protection on `main` requires a pull request. Admins are exempt
      # from that rule, but the ephemeral Actions token acts as
      # github-actions[bot], which is not an admin, so the formula commit needs
      # a personal token owned by a repository admin. The release itself keeps
      # the ephemeral token, because publishing a release crosses no protected
      # branch.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaser-bot
      email: actions@github.com
    directory: Formula
    test: |
      assert_match "waythrough version #{version}", shell_output("#{bin}/waythrough --version")
    install: |
      bin.install "waythrough"
